[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfg-demografia"
version = "0.1.0"
description = "Lector y resumen seguro de movimientos registrales del TSE"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tfg-demografia = "tfg_demografia.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tfg_demografia = ["schemas/*.json", "persistence/schema.sql"]